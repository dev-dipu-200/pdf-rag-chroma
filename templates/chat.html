<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local PDF Chatbot</title>
    <style>
        :root {
            --bg: #efe7da;
            --panel: rgba(255, 250, 242, 0.9);
            --panel-strong: #fffdfa;
            --line: rgba(52, 42, 32, 0.12);
            --text: #221b16;
            --muted: #6d6258;
            --accent: #a2482f;
            --accent-dark: #7d2f1b;
            --assistant: #fffdf8;
            --user: #2c5f4d;
            --danger: #a11d33;
            --warn: #8a5a00;
            --ok: #166534;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.8), transparent 28%),
                linear-gradient(140deg, #f7f0e4, #e4dfd5 55%, #d7e1df);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        .shell {
            display: grid;
            grid-template-columns: 340px 1fr;
            min-height: 100vh;
        }

        .sidebar,
        .main {
            padding: 20px;
        }

        .sidebar {
            border-right: 1px solid var(--line);
            background: rgba(255, 248, 238, 0.72);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(43, 30, 19, 0.08);
            overflow: hidden;
        }

        .panel-header {
            padding: 18px 20px 10px;
        }

        .panel-body {
            padding: 0 20px 20px;
        }

        h1, h2, h3, p {
            margin: 0;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 0.02em;
        }

        h2 {
            font-size: 1rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        p.subtle {
            margin-top: 6px;
            color: var(--muted);
            line-height: 1.5;
        }

        .auth-grid,
        .upload-grid {
            display: grid;
            gap: 10px;
        }

        input,
        textarea,
        button,
        select {
            width: 100%;
            border-radius: 14px;
            border: 1px solid var(--line);
            padding: 12px 14px;
            font: inherit;
            color: var(--text);
            background: rgba(255, 255, 255, 0.92);
        }

        textarea {
            min-height: 86px;
            resize: vertical;
        }

        button {
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            border: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        button.secondary {
            background: #ece1d0;
            color: var(--text);
        }

        button.secondary:hover {
            background: #e2d4bf;
        }

        button.ghost {
            background: transparent;
            color: var(--muted);
            border: 1px dashed var(--line);
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .inline {
            display: flex;
            gap: 10px;
        }

        .inline > * {
            flex: 1;
        }

        .status {
            font-size: 0.92rem;
            color: var(--muted);
            min-height: 22px;
        }

        .status.error {
            color: var(--danger);
        }

        .status.ok {
            color: var(--ok);
        }

        .user-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 999px;
            background: #f0e2d4;
            color: #6d371f;
            font-size: 0.92rem;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow: auto;
        }

        .item {
            border: 1px solid var(--line);
            background: var(--panel-strong);
            border-radius: 16px;
            padding: 12px 14px;
        }

        .item button {
            margin-top: 10px;
        }

        .badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.78rem;
            background: #efe1cf;
            color: #70431f;
        }

        .badge.indexed {
            background: #dff4e7;
            color: #166534;
        }

        .badge.failed {
            background: #f7d9df;
            color: #a11d33;
        }

        .badge.indexing,
        .badge.pending {
            background: #f8ecd2;
            color: var(--warn);
        }

        .chat-panel {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: calc(100vh - 40px);
        }

        .chat-header {
            padding: 22px 24px 12px;
            border-bottom: 1px solid var(--line);
        }

        .chat-body {
            padding: 20px 24px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 78%;
            padding: 14px 16px;
            border-radius: 18px;
            line-height: 1.6;
            white-space: pre-wrap;
            box-shadow: 0 10px 30px rgba(43, 30, 19, 0.05);
        }

        .message.user {
            align-self: flex-end;
            background: var(--user);
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--assistant);
            border: 1px solid rgba(44, 95, 77, 0.12);
            border-bottom-left-radius: 6px;
        }

        .meta {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .composer {
            border-top: 1px solid var(--line);
            padding: 16px 20px 20px;
            background: rgba(255, 251, 245, 0.92);
            display: grid;
            gap: 12px;
        }

        .composer-grid {
            display: grid;
            grid-template-columns: 1fr 110px 130px;
            gap: 12px;
        }

        .empty-state {
            padding: 18px;
            border: 1px dashed var(--line);
            border-radius: 16px;
            color: var(--muted);
            background: rgba(255,255,255,0.46);
        }

        @media (max-width: 980px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: none;
                border-bottom: 1px solid var(--line);
            }

            .chat-panel {
                min-height: auto;
            }

            .composer-grid {
                grid-template-columns: 1fr;
            }

            .message {
                max-width: 92%;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="panel">
                <div class="panel-header">
                    <h1>Archive Desk</h1>
                    <p class="subtle">Local Ollama chatbot for multiple PDFs, background ingestion, and private user history.</p>
                </div>
                <div class="panel-body stack">
                    <div id="userState" class="stack">
                        <div class="user-pill">Not logged in</div>
                    </div>
                    <div class="status" id="authStatus"></div>
                </div>
            </div>

            <div class="panel" id="authPanel">
                <div class="panel-header"><h2>Login</h2></div>
                <div class="panel-body stack">
                    <div class="auth-grid">
                        <input id="usernameInput" type="text" placeholder="Username">
                        <input id="passwordInput" type="password" placeholder="Password">
                    </div>
                    <div class="inline">
                        <button id="loginButton">Login</button>
                        <button id="registerButton" class="secondary">Register</button>
                    </div>
                </div>
            </div>

            <div class="panel" id="uploadPanel" style="display:none;">
                <div class="panel-header"><h2>PDF Upload</h2></div>
                <div class="panel-body stack">
                    <div class="upload-grid">
                        <input id="pdfInput" type="file" accept="application/pdf">
                        <div class="inline">
                            <button id="uploadButton">Queue PDFs</button>
                            <button id="reindexButton" class="secondary">Reindex All</button>
                        </div>
                    </div>
                    <div class="status" id="uploadStatus"></div>
                </div>
            </div>

            <div class="panel" id="documentsPanel" style="display:none;">
                <div class="panel-header"><h2>Your PDFs</h2></div>
                <div class="panel-body">
                    <div id="documentsList" class="list"></div>
                </div>
            </div>

            <div class="panel" id="sessionsPanel" style="display:none;">
                <div class="panel-header"><h2>Your History</h2></div>
                <div class="panel-body stack">
                    <button id="newChatButton" class="ghost">Start New Chat</button>
                    <div id="sessionsList" class="list"></div>
                </div>
            </div>
        </aside>

        <main class="main">
            <section class="panel chat-panel">
                <div class="chat-header">
                    <h2>Chat</h2>
                    <p class="subtle" id="chatHeadline">Login first, then upload PDFs and ask questions from your own document set.</p>
                </div>

                <div id="chatBody" class="chat-body">
                    <div class="empty-state">No active conversation yet.</div>
                </div>

                <form id="chatForm" class="composer">
                    <div class="composer-grid">
                        <textarea id="questionInput" placeholder="Ask a question from your PDFs..." disabled></textarea>
                        <input id="topKInput" type="number" min="1" max="15" value="5" disabled>
                        <button id="sendButton" type="submit" disabled>Ask</button>
                    </div>
                    <div class="status" id="chatStatus"></div>
                </form>
            </section>
        </main>
    </div>

    <script>
        const state = {
            user: null,
            activeSessionId: null,
            pollingId: null,
            token: localStorage.getItem("auth_token") || "",
        };

        const authPanel = document.getElementById("authPanel");
        const uploadPanel = document.getElementById("uploadPanel");
        const documentsPanel = document.getElementById("documentsPanel");
        const sessionsPanel = document.getElementById("sessionsPanel");
        const userState = document.getElementById("userState");
        const authStatus = document.getElementById("authStatus");
        const uploadStatus = document.getElementById("uploadStatus");
        const chatStatus = document.getElementById("chatStatus");
        const chatHeadline = document.getElementById("chatHeadline");
        const chatBody = document.getElementById("chatBody");
        const sessionsList = document.getElementById("sessionsList");
        const documentsList = document.getElementById("documentsList");
        const questionInput = document.getElementById("questionInput");
        const topKInput = document.getElementById("topKInput");
        const sendButton = document.getElementById("sendButton");

        async function api(path, options = {}) {
            const headers = {
                ...(options.headers || {})
            };
            if (!(options.body instanceof FormData) && !headers["Content-Type"]) {
                headers["Content-Type"] = "application/json";
            }
            if (state.token) {
                headers["Authorization"] = `Bearer ${state.token}`;
            }

            const response = await fetch(path, {
                ...options,
                headers
            });

            if (!response.ok) {
                let detail = "Request failed.";
                try {
                    const payload = await response.json();
                    detail = payload.detail || JSON.stringify(payload);
                } catch (_) {
                    detail = await response.text() || detail;
                }
                throw new Error(detail);
            }

            if (response.status === 204) {
                return null;
            }

            const contentType = response.headers.get("content-type") || "";
            if (contentType.includes("application/json")) {
                return response.json();
            }
            return response.text();
        }

        function setStatus(node, text, kind = "") {
            node.textContent = text || "";
            node.className = kind ? `status ${kind}` : "status";
        }

        function scrollToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function renderAuthState() {
            if (state.user) {
                userState.innerHTML = `
                    <div class="user-pill">Logged in as <strong>${state.user.username}</strong></div>
                    <button id="logoutButton" class="secondary">Logout</button>
                `;
                authPanel.style.display = "none";
                uploadPanel.style.display = "";
                documentsPanel.style.display = "";
                sessionsPanel.style.display = "";
                questionInput.disabled = false;
                topKInput.disabled = false;
                sendButton.disabled = false;
                chatHeadline.textContent = "Ask questions from your indexed PDFs. Only your own chat history is shown here.";
                document.getElementById("logoutButton").addEventListener("click", logout);
            } else {
                userState.innerHTML = `<div class="user-pill">Not logged in</div>`;
                authPanel.style.display = "";
                uploadPanel.style.display = "none";
                documentsPanel.style.display = "none";
                sessionsPanel.style.display = "none";
                questionInput.disabled = true;
                topKInput.disabled = true;
                sendButton.disabled = true;
                state.activeSessionId = null;
                chatHeadline.textContent = "Login first, then upload PDFs and ask questions from your own document set.";
                chatBody.innerHTML = `<div class="empty-state">No active conversation yet.</div>`;
            }
        }

        function renderDocuments(documents) {
            if (!documents.length) {
                documentsList.innerHTML = `<div class="empty-state">No PDFs uploaded yet.</div>`;
                return;
            }

            documentsList.innerHTML = documents.map((doc) => `
                <div class="item">
                    <strong>${doc.original_filename}</strong>
                    <div class="badge ${doc.status}">${doc.status}</div>
                    <div class="meta">Chunks: ${doc.chunks_added}</div>
                    ${doc.error_message ? `<div class="meta" style="color: var(--danger);">${doc.error_message}</div>` : ""}
                </div>
            `).join("");
        }

        function renderSessions(sessions) {
            if (!sessions.length) {
                sessionsList.innerHTML = `<div class="empty-state">No chat history yet.</div>`;
                return;
            }

            sessionsList.innerHTML = sessions.map((session) => `
                <div class="item">
                    <strong>${session.title}</strong>
                    <div class="meta">${new Date(session.updated_at).toLocaleString()}</div>
                    <button class="secondary" data-session-id="${session.id}">Open</button>
                </div>
            `).join("");

            sessionsList.querySelectorAll("button[data-session-id]").forEach((button) => {
                button.addEventListener("click", () => loadMessages(Number(button.dataset.sessionId)));
            });
        }

        function addMessage(role, content, sources = []) {
            const bubble = document.createElement("div");
            bubble.className = `message ${role}`;
            const textNode = document.createTextNode(content);
            bubble.appendChild(textNode);

            if (sources.length) {
                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = `Sources: ${sources.join(", ")}`;
                bubble.appendChild(meta);
            }

            chatBody.appendChild(bubble);
            scrollToBottom();
            return bubble;
        }

        function renderMessages(messages) {
            chatBody.innerHTML = "";
            if (!messages.length) {
                chatBody.innerHTML = `<div class="empty-state">This chat has no messages yet.</div>`;
                return;
            }

            messages.forEach((message) => addMessage(message.role, message.content, message.sources || []));
        }

        async function refreshDocuments() {
            if (!state.user) return;
            const documents = await api("/ingest/documents");
            renderDocuments(documents);
        }

        async function refreshSessions() {
            if (!state.user) return;
            const sessions = await api("/query/sessions");
            renderSessions(sessions);
        }

        async function loadMessages(sessionId) {
            state.activeSessionId = sessionId;
            const messages = await api(`/query/sessions/${sessionId}/messages`);
            renderMessages(messages);
            setStatus(chatStatus, `Loaded chat #${sessionId}.`);
        }

        async function refreshMe() {
            try {
                state.user = await api("/auth/me");
            } catch (_) {
                state.user = null;
                state.token = "";
                localStorage.removeItem("auth_token");
            }
            renderAuthState();
            if (state.user) {
                await refreshDocuments();
                await refreshSessions();
            }
        }

        async function loginOrRegister(path) {
            const username = document.getElementById("usernameInput").value.trim();
            const password = document.getElementById("passwordInput").value;

            if (!username || !password) {
                setStatus(authStatus, "Username and password are required.", "error");
                return;
            }

            try {
                const payload = await api(path, {
                    method: "POST",
                    body: JSON.stringify({ username, password })
                });
                state.token = payload.access_token;
                localStorage.setItem("auth_token", state.token);
                state.user = payload.user;
                setStatus(authStatus, `${path.endsWith("register") ? "Registered" : "Logged in"} as ${state.user.username}.`, "ok");
                renderAuthState();
                await refreshDocuments();
                await refreshSessions();
            } catch (error) {
                setStatus(authStatus, error.message, "error");
            }
        }

        async function logout() {
            try {
                await api("/auth/logout", { method: "POST" });
            } finally {
                state.user = null;
                state.token = "";
                localStorage.removeItem("auth_token");
                setStatus(authStatus, "Logged out.", "ok");
                renderAuthState();
                sessionsList.innerHTML = "";
                documentsList.innerHTML = "";
            }
        }

        async function uploadPdfs() {
            const input = document.getElementById("pdfInput");
            if (!input.files.length) {
                setStatus(uploadStatus, "Select a PDF file first.", "error");
                return;
            }

            const formData = new FormData();
            formData.append("file", input.files[0]);

            try {
                const response = await fetch("/ingest/pdf", {
                    method: "POST",
                    headers: state.token ? { "Authorization": `Bearer ${state.token}` } : {},
                    body: formData
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || "Upload failed.");
                }
                const payload = await response.json();
                setStatus(uploadStatus, `${payload.document.original_filename} queued for background indexing.`, "ok");
                input.value = "";
                await refreshDocuments();
                startPolling();
            } catch (error) {
                setStatus(uploadStatus, error.message, "error");
            }
        }

        async function reindexAll() {
            try {
                const payload = await api("/ingest/reindex", { method: "POST" });
                setStatus(uploadStatus, `${payload.queued_documents} PDF file(s) queued for reindexing.`, "ok");
                await refreshDocuments();
                startPolling();
            } catch (error) {
                setStatus(uploadStatus, error.message, "error");
            }
        }

        function startPolling() {
            if (state.pollingId) {
                clearInterval(state.pollingId);
            }

            state.pollingId = setInterval(async () => {
                if (!state.user) return;
                const documents = await api("/ingest/documents");
                renderDocuments(documents);
                const active = documents.some((doc) => doc.status === "pending" || doc.status === "indexing");
                if (!active) {
                    clearInterval(state.pollingId);
                    state.pollingId = null;
                }
            }, 4000);
        }

        async function streamAnswer(question, topK) {
            chatBody.querySelector(".empty-state")?.remove();
            addMessage("user", question);
            const assistantBubble = addMessage("assistant", "");
            setStatus(chatStatus, "Generating answer...");

            const response = await fetch("/query/stream", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    ...(state.token ? { "Authorization": `Bearer ${state.token}` } : {})
                },
                body: JSON.stringify({
                    question,
                    top_k: topK,
                    session_id: state.activeSessionId
                })
            });

            if (!response.ok || !response.body) {
                const errorText = await response.text();
                throw new Error(errorText || "Streaming request failed.");
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let sources = [];

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n");
                buffer = lines.pop() || "";

                for (const line of lines) {
                    if (!line.trim()) continue;
                    const payload = JSON.parse(line);

                    if (payload.type === "meta") {
                        state.activeSessionId = payload.session_id;
                        sources = payload.sources || [];
                        continue;
                    }

                    if (payload.type === "token") {
                        assistantBubble.firstChild.textContent += payload.content;
                        scrollToBottom();
                        continue;
                    }

                    if (payload.type === "done") {
                        if (sources.length) {
                            const meta = document.createElement("div");
                            meta.className = "meta";
                            meta.textContent = `Sources: ${sources.join(", ")}`;
                            assistantBubble.appendChild(meta);
                        }
                        setStatus(chatStatus, "Answer complete.", "ok");
                        await refreshSessions();
                        continue;
                    }

                    if (payload.type === "error") {
                        throw new Error(payload.detail || "Unknown streaming error.");
                    }
                }
            }
        }

        document.getElementById("loginButton").addEventListener("click", () => loginOrRegister("/auth/login"));
        document.getElementById("registerButton").addEventListener("click", () => loginOrRegister("/auth/register"));
        document.getElementById("uploadButton").addEventListener("click", uploadPdfs);
        document.getElementById("reindexButton").addEventListener("click", reindexAll);
        document.getElementById("newChatButton").addEventListener("click", () => {
            state.activeSessionId = null;
            chatBody.innerHTML = `<div class="empty-state">New chat started. Ask your first question.</div>`;
            setStatus(chatStatus, "New chat ready.");
        });

        document.getElementById("chatForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const question = questionInput.value.trim();
            const topK = Number(topKInput.value) || 5;

            if (!question) return;
            if (!state.user) {
                setStatus(chatStatus, "Login required.", "error");
                return;
            }

            questionInput.value = "";
            sendButton.disabled = true;
            questionInput.disabled = true;
            topKInput.disabled = true;

            try {
                await streamAnswer(question, topK);
            } catch (error) {
                setStatus(chatStatus, error.message, "error");
            } finally {
                sendButton.disabled = false;
                questionInput.disabled = false;
                topKInput.disabled = false;
                questionInput.focus();
            }
        });

        refreshMe().then(startPolling);
    </script>
</body>
</html>
