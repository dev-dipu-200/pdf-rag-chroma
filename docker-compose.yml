x-app-base: &app-base
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      PYTHON_BASE_IMAGE: python:3.12-slim
  volumes:
    - uploads_data:/app/uploads
    - chroma_data:/app/chroma_data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:

  postgres:
    image: postgres:16
    container_name: updesh_postgres
    environment:
      POSTGRES_DB: pdf_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdf_rag"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: updesh_redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  api:
    <<: *app-base
    container_name: updesh_api
    command: ["bash", "docker/api-entrypoint.sh"]
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    <<: *app-base
    container_name: updesh_worker
    command: ["sh", "-c", "celery -A celery_worker worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-1}"]
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: updesh_frontend
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
